name: scrape-and-deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов (UTC), не ровно в :00 — там очередь у GitHub
  workflow_dispatch:
    inputs:
      shops:
        description: "id магазинов через пробел (пусто — все)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape
        if: github.event_name != 'push'
        run: python scraper/run.py ${{ github.event.inputs.shops }}

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push -q

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
